on: [pull_request, push]

jobs:
  validate-metadata:
    # required to run on Linux because this is a docker container action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ashutoshgngwr/validate-fastlane-supply-metadata@v2
        with:
          fastlaneDir: metadata
          # Bare "es" isn't accepted by Play Store but I'd rather not use "es-ES"
          # or whatever as my metadata is supposed to be internationally
          # acceptable.
          usePlayStoreLocales: false

  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-price-log-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
